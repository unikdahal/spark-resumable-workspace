# Three-master HA ensemble plus workers, sized for a laptop. Lease and probe timeouts are
# deliberately short so a takeover scenario finishes in seconds rather than minutes: takeover is
# rejected until the previous lease expires, so a production-sized 10m lease would make every
# scenario take ten minutes.
celeborn.master.ha.enabled                                true
celeborn.master.ha.node.ids                               1,2,3
celeborn.master.ha.node.1.host                            localhost
celeborn.master.ha.node.1.port                            9097
celeborn.master.ha.node.1.ratis.port                      9872
celeborn.master.ha.node.2.host                            localhost
celeborn.master.ha.node.2.port                            9098
celeborn.master.ha.node.2.ratis.port                      9873
celeborn.master.ha.node.3.host                            localhost
celeborn.master.ha.node.3.port                            9099
celeborn.master.ha.node.3.ratis.port                      9874
celeborn.master.heartbeat.application.timeout             60s
celeborn.master.applicationLease.maxDuration              10m
celeborn.master.recovery.taskCommit.maxPayloadSize        1m
celeborn.worker.storage.dirs                              __WORKER_DATA_DIR__
celeborn.worker.monitor.disk.enabled                      false
celeborn.client.push.replicate.enabled                    false
celeborn.metrics.enabled                                  false

# Independent repositories used by this workspace.
# This file is the pin list. The checkouts themselves are not gitlinks and are
# not part of this repository's source tree.
#
# Clone defaults: workspace/bootstrap.sh clones role: active-upstream only.
# Historical POCs and archived-research checkouts stay on GitHub; their local
# checkouts were removed 2026-08-25 and can be restored from the pins below.

repos:
  - id: spark
    url: https://github.com/unikdahal/spark.git
    upstream: https://github.com/apache/spark.git
    commit: ace8a2de502a727cd41126c560e9b18827ff421e
    branch: resumable-driver-upstream
    local_path: spark-resumable-upstream
    role: active-upstream
    status: wip
    notes: Canonical Spark fork. Scheduler recovery SPI, recovered MapStatuses, V2 write recovery.

  - id: celeborn
    url: https://github.com/unikdahal/celeborn.git
    upstream: https://github.com/apache/celeborn.git
    commit: 67b89066b418c37dae9e3ff3a03cdf011f33274d
    branch: resume-adoption-patch10
    local_path: celeborn
    role: active-upstream
    status: wip
    notes: Canonical Celeborn fork. Application lease, committed shuffle catalog, recovery bindings, blob backend.

  - id: iceberg
    url: https://github.com/unikdahal/iceberg.git
    upstream: https://github.com/apache/iceberg.git
    commit: bd62d57a0624457d35e3b57dc34a7519659dd454
    branch: supports-snapshot-id
    local_path: oss-fixes/iceberg
    role: active-upstream
    status: wip
    notes: Canonical Iceberg fork. Snapshot idempotency ledger and Spark write-recovery pins.

